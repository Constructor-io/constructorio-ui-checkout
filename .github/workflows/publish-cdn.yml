name: 'Publish: Publish to CDN'

on:
  workflow_call:
    inputs:
      version:
        description: 'The repository version to publish'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: 'The repository version to publish'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish-to-cdn:
    name: Publish to CDN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove version prefix
        uses: ./.github/actions/remove-version-prefix
        id: version
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build compiled package for publishing
        uses: "./.github/actions/compile"
        with:
          version: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE }}
          role-session-name: cdn-publish-action
          aws-region: us-east-1

      - name: Copy files to CDN
        shell: bash
        run: |
          mkdir s3_dist
          cp dist/standalone/constructorio-ui-checkout.standalone.js s3_dist/${{ steps.version.outputs.without_prefix }}.js
          aws s3 sync s3_dist s3://constructor-frontend-prod/ui/checkout --cache-control 'public, max-age=1800' --acl 'public-read'

      - name: Notify Slack about new publish to CDN
        uses: ravsamhq/notify-slack-action@bca2d7f5660b833a27bda4f6b8bef389ebfefd25 # v2.3.0
        with:
          notification_title: "☁️ New constructorio-ui-checkout release published to CDN at version ${{ inputs.version }}"
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
